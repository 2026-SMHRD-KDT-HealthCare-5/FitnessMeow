services:
  mysql:
    image: mysql:8.4
    container_name: fitnessmeow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitnessmeow
      MYSQL_USER: fitnessmeow
      MYSQL_PASSWORD: fitnessmeow_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitnessmeow-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fitnessmeow
      DB_USER: fitnessmeow
      DB_PASSWORD: fitnessmeow_password
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fitnessmeow-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mysql-data:
